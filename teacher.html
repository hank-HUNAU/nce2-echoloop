<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="icon" type="image/png" href="favicon.png">
<title>NCE2 Echo · 教师端 · 账号管理与学情</title>
<!-- 教师端：账号管理（学生/家长）+ 全班学情监控。数据源 Supabase el2_accounts / el2_events（教师 RLS 全量只读） -->
<style>
  :root{--btn:#3B5BDB;--ok:#12B886;--txt:#212529;--sub:#6C757D;--line:#E9ECEF;--bad:#E03131;--warn:#F59F00}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Noto Sans SC","Segoe UI",Roboto,sans-serif;
       background:#F8F9FB;color:var(--txt);min-height:100vh;
       padding:calc(16px + env(safe-area-inset-top,0px)) calc(14px + env(safe-area-inset-right,0px))
               calc(16px + env(safe-area-inset-bottom,0px)) calc(14px + env(safe-area-inset-left,0px))}
  .wrap{max-width:820px;margin:0 auto}
  h1{font-size:20px;margin-bottom:2px}
  h1 small{font-size:12px;font-weight:400;color:var(--sub)}
  .tabs{display:flex;gap:8px;margin:14px 0}
  .tabs button{flex:0 0 auto;min-height:46px;padding:0 20px;border:1.5px solid var(--line);border-radius:12px;
        background:#fff;font-size:14px;font-weight:600;color:var(--sub);cursor:pointer}
  .tabs button.on{border-color:var(--btn);color:var(--btn);background:#F0F4FF}
  section{background:#fff;border-radius:16px;padding:18px;margin-top:12px;box-shadow:0 2px 10px rgba(33,37,41,.05)}
  h2{font-size:15px;margin-bottom:10px;display:flex;align-items:center;gap:8px}
  .tip{font-size:12px;color:var(--sub);line-height:1.6;margin-bottom:10px}
  label{display:block;font-size:13px;font-weight:600;margin:10px 0 5px}
  input,select{width:100%;height:46px;border:1.5px solid var(--line);border-radius:12px;padding:0 12px;
        font-size:16px;outline:none;background:#FBFCFD}
  input:focus,select:focus{border-color:var(--btn);background:#fff}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  button.p{min-height:48px;border:0;border-radius:12px;background:var(--btn);color:#fff;
        font-size:15px;font-weight:700;cursor:pointer;padding:0 20px;margin-top:14px}
  button.p:active{transform:scale(.97)}
  button.p:disabled{opacity:.6}
  button.sm{min-height:40px;border:1.5px solid var(--line);border-radius:9px;background:#fff;
        color:var(--sub);font-size:12px;cursor:pointer;padding:0 10px}
  .err{color:var(--bad);font-size:13px;min-height:18px;margin-top:8px}
  .okmsg{color:var(--ok);font-size:13px;min-height:18px;margin-top:8px}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th{font-size:11px;color:var(--sub);text-align:left;padding:6px 4px;border-bottom:1px solid var(--line);font-weight:600}
  td{padding:9px 4px;border-bottom:1px dashed var(--line);vertical-align:middle}
  td .r{display:inline-block;border-radius:6px;padding:1px 7px;font-size:11px;font-weight:600}
  .r.kid{background:#EDF2FF;color:#364FC7}.r.parent{background:#E6FCF5;color:#087F5B}.r.teacher{background:#FFF9DB;color:#E67700}
  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
  .card{border:1.5px solid var(--line);border-radius:14px;padding:14px}
  .card b{font-size:14px}
  .card .m{font-size:12px;color:var(--sub);line-height:1.7;margin-top:6px;font-variant-numeric:tabular-nums}
  .card .due{color:var(--warn);font-weight:600}
  .off{color:var(--bad);font-size:13px}
  .logout{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));right:calc(14px + env(safe-area-inset-right,0px));
        min-height:40px;border:1.5px solid var(--line);border-radius:10px;background:#fff;color:var(--sub);
        font-size:12px;cursor:pointer;padding:0 12px}
</style>
</head>
<body>
<div class="wrap">
  <h1>NCE2 Echo · 教师端 <small>账号管理 + 全班学情</small></h1>
  <button class="logout" id="out">退出</button>

  <div class="tabs">
    <button id="tAcct" class="on">账号管理</button>
    <button id="tMon">学情监控</button>
  </div>

  <section id="secAcct">
    <h2>新建账号</h2>
    <div class="tip">为学生 / 家长创建账号并发放。密码至少 8 位；家庭码决定学情归属。</div>
    <label>角色</label>
    <select id="cRole"><option value="kid">学生</option><option value="parent">家长</option></select>
    <div class="grid2">
      <div><label>邮箱（登录账号）</label><input id="cEmail" type="email" placeholder="student@example.com"></div>
      <div><label>初始密码</label><input id="cPw" type="text" placeholder="至少 8 位，告知本人后自行保管"></div>
    </div>
    <div class="grid2">
      <div><label>称呼（选填）</label><input id="cName" type="text" placeholder="如：Stuart" maxlength="20"></div>
      <div><label>家庭码</label><select id="cFam"><option value="">加载中…</option></select></div>
    </div>
    <button class="p" id="cGo">创建账号</button>
    <div class="err" id="cErr"></div><div class="okmsg" id="cOk"></div>
  </section>

  <section id="secAcctList">
    <h2>账号列表 <span style="font-size:11px;color:var(--sub);font-weight:400">（重置密码直接覆盖旧密码）</span></h2>
    <div id="acctBox" style="overflow-x:auto">读取中…</div>
  </section>

  <section id="secMon" style="display:none">
    <h2>全班学情（近 7 天）<button class="sm" id="mRf" style="margin-left:auto">刷新</button></h2>
    <div class="tip">未登录学习不上云；此处只显示登录后同步的学习。判定线：本周 ≥3 天「完整精听+跟读」。</div>
    <div class="cards" id="monBox">读取中…</div>
  </section>
</div>

<script>
(function(){
"use strict";
var SB="https://zwatrfbqkrvxpqtypdgx.supabase.co";
var KEY="sb_publishable_mnkBBrHF70guvwfUNXuhBg_sIok8eBc";
var PORTAL="https://hank-hunau.github.io/nce2-echoloop/login.html";
function $(id){ return document.getElementById(id); }
function esc(x){ return String(x==null?"":x).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];}); }
function pad(n){ return (n<10?"0":"")+n; }

/* ===== 门禁：教师 token 经门户 hash 带入 ===== */
var TOK=(function(){ var m=(location.hash||"").match(/[#&]t=([^&]+)/);
  if(m){ history.replaceState(null,"",location.pathname+location.search);
    try{ return decodeURIComponent(m[1]); }catch(e){ return m[1]; } } return null; })();
function kick(){ location.replace(PORTAL); }
if(!TOK){ kick(); return; }

function api(method,path,body,cb){
  var x=new XMLHttpRequest();
  x.open(method,SB+path,true);
  x.setRequestHeader("apikey",KEY); x.setRequestHeader("Authorization","Bearer "+TOK);
  if(body) x.setRequestHeader("Content-Type","application/json");
  x.onload=function(){
    if(x.status===401||x.status===403 && String(x.responseText||"").indexOf("permission")>=0){ cb(null,"HTTP "+x.status,x.status); return; }
    var d=null; try{ d=x.responseText?JSON.parse(x.responseText):null; }catch(e){}
    if(x.status>=200&&x.status<300) cb(d,null); else cb(null,(d&&(d.message||d.msg))||("HTTP "+x.status),x.status);
  };
  x.onerror=function(){ cb(null,"网络异常"); };
  x.send(body?JSON.stringify(body):null);
}

/* ===== 账号管理 ===== */
var ACCTS=[], FAMS=[];
function loadFamilies(){
  api("GET","/rest/v1/el2_families?select=family_code,name&order=family_code",null,function(d,e){
    if(e){ $("cFam").innerHTML='<option value="">读取失败</option>'; return; }
    FAMS=d||[];
    var h=""; FAMS.forEach(function(f){ h+='<option value="'+esc(f.family_code)+'">'+esc(f.family_code)+(f.name?" · "+esc(f.name):"")+'</option>'; });
    $("cFam").innerHTML=h||'<option value="">（无家庭码）</option>';
  });
}
function loadAccounts(){
  api("GET","/rest/v1/el2_accounts?select=uid,role,family_code,display_name,email&order=role.asc",null,function(d,e){
    if(e){ $("acctBox").innerHTML='<span class="off">'+esc(e)+'</span>'; return; }
    ACCTS=d||[];
    var h='<table><tr><th>角色</th><th>称呼</th><th>邮箱</th><th>家庭码</th><th></th></tr>';
    ACCTS.forEach(function(a){
      h+='<tr><td><span class="r '+esc(a.role)+'">'+(a.role==="kid"?"学生":a.role==="parent"?"家长":"教师")+'</span></td>'
        +'<td>'+esc(a.display_name||"—")+'</td>'
        +'<td>'+esc(a.email||"—")+'</td>'
        +'<td>'+esc(a.family_code||"—")+'</td>'
        +'<td>'+(a.role!=="teacher"?'<button class="sm" data-rst="'+esc(a.email)+'">重置密码</button>':'')+'</td></tr>';
    });
    h+='</table>';
    $("acctBox").innerHTML=h;
    $("acctBox").querySelectorAll("[data-rst]").forEach(function(b){
      b.addEventListener("click",function(){
        var em=b.getAttribute("data-rst");
        var np=window.prompt("为 "+em+" 设置新密码（至少 8 位）：");
        if(!np) return;
        b.disabled=true;
        api("POST","/rest/v1/rpc/el2_reset_password",{p_email:em,p_new_password:np},function(d,e2){
          b.disabled=false;
          if(e2){ window.alert("失败："+e2); return; }
          window.alert("已重置。请把新密码告知本人。");
        });
      });
    });
  });
}
$("cGo").addEventListener("click",function(){
  var err=$("cErr"), okm=$("cOk"), btn=$("cGo");
  err.textContent=""; okm.textContent="";
  var role=$("cRole").value, em=$("cEmail").value.trim().toLowerCase(),
      pw=$("cPw").value, dn=$("cName").value.trim(), fam=$("cFam").value;
  if(!em||!pw||!fam){ err.textContent="邮箱、密码、家庭码都要填"; return; }
  btn.disabled=true; btn.textContent="创建中…";
  api("POST","/rest/v1/rpc/el2_create_account",
    {p_email:em,p_password:pw,p_role:role,p_display:dn,p_family_code:fam},function(d,e){
    btn.disabled=false; btn.textContent="创建账号";
    if(e){ err.textContent=e; return; }
    okm.textContent="已创建："+em+"（"+(role==="kid"?"学生":"家长")+"）";
    $("cEmail").value=""; $("cPw").value=""; $("cName").value="";
    loadAccounts();
  });
});

/* ===== 学情监控（按学生） ===== */
function loadMonitor(){
  api("GET","/rest/v1/el2_accounts?select=uid,role,display_name,email&order=role.asc",null,function(accs,e1){
    if(e1){ $("monBox").innerHTML='<span class="off">'+esc(e1)+'</span>'; return; }
    api("GET","/rest/v1/el2_events?select=owner_uid,stage,duration_s,client_date,synced_at&order=synced_at.desc&limit=3000",null,function(evts,e2){
      if(e2){ $("monBox").innerHTML='<span class="off">'+esc(e2)+'</span>'; return; }
      paintMonitor(accs||[],evts||[]);
    });
  });
}
function paintMonitor(accs,evts){
  var names={}, kids=[];
  accs.forEach(function(a){ names[a.uid]=a; if(a.role==="kid") kids.push(a); });
  var byUid={};
  evts.forEach(function(v){
    var k=v.owner_uid||"?"; var o=byUid[k]=byUid[k]||{min:{},full:{},latest:"",n:0};
    var d=String(v.client_date||"").slice(0,10); if(!d) return;
    o.min[d]=(o.min[d]||0)+(v.duration_s||0);
    (o.full[d]=o.full[d]||{})[v.stage]=1;
    o.n++;
    if(!o.latest||String(v.synced_at)>o.latest) o.latest=String(v.synced_at);
  });
  var h="";
  kids.forEach(function(a){
    var o=byUid[a.uid]||{min:{},full:{},latest:"",n:0};
    var days=[], fullN=0, total=0;
    for(var k=6;k>=0;k--){
      var dt=new Date(Date.now()-k*864e5);
      var ds=dt.getFullYear()+"-"+pad(dt.getMonth()+1)+"-"+pad(dt.getDate());
      var m=Math.round((o.min[ds]||0)/60);
      var full=!!(o.full[ds]&&o.full[ds].intensive&&o.full[ds].shadow);
      if(full) fullN++; total+=m;
      days.push({d:ds.slice(5),m:m,full:full});
    }
    var max=1; days.forEach(function(x){ if(x.m>max) max=x.m; });
    var bars="";
    days.forEach(function(x){
      var bh=Math.max(3,Math.round(x.m/max*40));
      var col=x.full?"#12B886":(x.m>0?"#3B5BDB":"#DEE2E6");
      bars+='<div style="flex:1;text-align:center"><div style="height:'+bh+'px;background:'+col+';border-radius:4px 4px 0 0;margin:0 auto;width:72%"></div>'
          +'<div style="font-size:9px;color:var(--sub)">'+x.d+'</div></div>';
    });
    h+='<div class="card"><b>'+esc(a.display_name||a.email||"学生")+'</b>'
      +(fullN>=3?' <span style="font-size:10px;background:#D3F9D8;color:#087F5B;border-radius:6px;padding:1px 6px;font-weight:600">达标</span>':'')
      +'<div style="display:flex;align-items:flex-end;gap:4px;height:52px;margin-top:8px">'+bars+'</div>'
      +'<div class="m">本周完整课 <b>'+fullN+'</b>/3 天 · 近 7 天 <b>'+total+'</b> 分钟<br>'
      +(o.latest?('最近上报 '+esc(String(o.latest).slice(5,16).replace("T"," "))):'<span class="due">暂无学习记录</span>')+'</div></div>';
  });
  if(!kids.length) h='<span class="off">还没有学生账号，请在「账号管理」创建。</span>';
  $("monBox").innerHTML=h;
}

/* ===== Tab 切换与启动 ===== */
$("tAcct").addEventListener("click",function(){ $("tAcct").className="on"; $("tMon").className="";
  $("secAcct").style.display=""; $("secAcctList").style.display=""; $("secMon").style.display="none"; });
$("tMon").addEventListener("click",function(){ $("tMon").className="on"; $("tAcct").className="";
  $("secMon").style.display=""; $("secAcct").style.display="none"; $("secAcctList").style.display="none"; loadMonitor(); });
$("mRf").addEventListener("click",loadMonitor);
$("out").addEventListener("click",function(){ location.replace(PORTAL); });

loadFamilies();
loadAccounts();
setInterval(function(){ if(!$("secMon").style.display || $("secMon").style.display!=="none") loadMonitor(); },30000);
})();
</script>
</body>
</html>
