<style>
:root{--acc:#4C6EF5;--accBtn:#3B5BDB;--ok:#12B886;--bad:#E03131;--warn:#F59F00;--ink:#212529;--sub:#6C757D;
 --line:#E9ECEF;--card:#fff;--bg:#F5F6F8;--stage1:#4C6EF5;--stage2:#9C36B5;--stage3:#1971C2;--stage4:#12B886}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif;
 background:var(--bg);color:var(--ink);font-size:16px;line-height:1.6;font-variant-numeric:tabular-nums;touch-action:manipulation;padding-bottom:calc(88px + env(safe-area-inset-bottom,0px))}
.wrap{max-width:880px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top,0px)) calc(14px + env(safe-area-inset-right,0px)) 20px calc(14px + env(safe-area-inset-left,0px))}
h1{font-size:24px;margin:0}
h2{font-size:18px;margin:0 0 10px}
.sec{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-top:14px;touch-action:pan-y}
.tip{color:var(--sub);font-size:15px;margin:0 0 10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:12px;
 padding:12px 20px;font-size:15px;font-family:inherit;cursor:pointer;background:var(--accBtn);color:#fff;min-height:52px}
.btn.g{background:#F1F3F5;color:var(--ink);border:1px solid var(--line)}
.btn.ok{background:var(--ok)} .btn.rd{background:var(--bad)}
.btn.sm{padding:7px 12px;min-height:50px;font-size:14px;border-radius:9px}
.btn:disabled{opacity:.45;cursor:default}
.pill{display:inline-block;border-radius:999px;padding:2px 10px;font-size:13px;background:#EDF2FF;color:#364FC7}
.tag{display:inline-block;border-radius:6px;padding:0 6px;font-size:13px;background:#EDF2FF;color:#364FC7;margin-right:4px}
.tag.w{background:#E6FCF5;color:#087F5B}.tag.v{background:#F3F0FF;color:#6741D9}.tag.d{background:#FFF9DB;color:#E67700}
.item{display:flex;align-items:center;gap:10px;padding:12px 2px;border-bottom:1px dashed var(--line)}
.item:last-child{border-bottom:0}
.item .tt{flex:1;min-width:0}
.item .meta{font-size:14px;color:var(--sub)}
.play{flex:0 0 52px;width:52px;height:52px;border-radius:50%;border:0;background:var(--accBtn);color:#fff;font-size:15px;cursor:pointer}
.play.on{background:var(--bad)}
.ck{width:22px;height:22px;accent-color:var(--ok)}
.late{color:var(--bad);font-weight:600}
.empty{color:var(--sub);text-align:center;padding:10px 0;font-size:14px}
/* 课程网格 */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(72px,1fr));gap:8px}
.cell{border:1px solid var(--line);border-radius:12px;background:#fff;text-align:center;padding:8px 2px;cursor:pointer;position:relative}
.cell b{font-size:16px;display:block}
.cell span{font-size:12px;color:var(--sub);display:block}
.cell.done{border-color:var(--ok);background:#F0FFF9}
.cell.doing{border-color:var(--acc);background:#F0F4FF}
.cell.due::after{content:"";position:absolute;top:6px;right:6px;width:8px;height:8px;border-radius:50%;background:var(--bad)}
/* 底部导航 */
nav.tabs{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);
 display:flex;z-index:30;padding-bottom:calc(20px + env(safe-area-inset-bottom,0px))}
nav.tabs a{flex:1;text-align:center;padding:9px 0 8px;font-size:14px;color:var(--sub);text-decoration:none;min-height:56px}
nav.tabs a{position:relative}
nav.tabs a .bdg{position:absolute;top:6px;left:calc(50% + 4px);width:9px;height:9px;border-radius:50%;background:#E03131;border:1.5px solid #fff}
nav.tabs a svg{width:26px;height:26px;display:block;margin:0 auto 2px}
nav.tabs a.on{color:var(--acc)}
/* 句子列表 */
.sent{display:flex;align-items:flex-start;gap:10px;padding:12px 4px;border-bottom:1px dashed var(--line)}
.sent.cur{background:#F0F4FF;border-radius:10px}
.sent .en{font-family:Georgia,"Times New Roman",serif;font-size:18px;line-height:1.7}
.sent .zh{color:var(--sub);font-size:17px;line-height:1.65}
.sent .idx{flex:0 0 26px;color:var(--sub);font-size:14px;padding-top:3px}
.item .tt .en{font-family:Georgia,"Times New Roman",serif;font-size:18px;line-height:1.55}
.star{background:none;border:0;font-size:28px;color:#CED4DA;cursor:pointer;padding:0;width:50px;height:50px;flex:0 0 50px;display:inline-flex;align-items:center;justify-content:center}
.star.on{color:var(--warn)}
.detail{background:#F8F9FC;border-radius:12px;padding:10px 12px;margin:6px 0;font-size:15px}
.detail .ch{display:inline-block;background:#fff;border:1px solid var(--line);border-radius:8px;padding:3px 9px;margin:2px 3px;font-size:14px}
.detail .ch i{font-style:normal;color:var(--sub);font-size:12px;margin-left:4px}
.blur{filter:blur(7px);transition:filter .3s;user-select:none}
/* 阶段条 */
.stepper{display:flex;gap:6px;margin:12px 0}
.tipq{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line);background:#fff;color:var(--sub);font-size:13px;font-weight:700;cursor:pointer;vertical-align:middle;flex:0 0 26px}
.tipd .tip{background:#F8F9FC;border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin-top:6px}
.bk2{width:56px;height:74px;border-radius:10px;object-fit:cover;display:block;flex:0 0 56px;border:0.5px solid var(--color-border-tertiary, #E9ECEF);background:#F1F3F5}
.blurred{filter:blur(9px);user-select:none;pointer-events:none;transition:filter .25s}
/* 课程中心 / 课程库 */
/* 顶栏：所有页面统一——吸顶、压住刘海安全区、内容从其下方滚过 */
.topbar{position:sticky;top:0;z-index:40;display:flex;align-items:center;justify-content:space-between;gap:10px;
 margin:calc(-14px - env(safe-area-inset-top,0px)) calc(-14px - env(safe-area-inset-right,0px)) 6px calc(-14px - env(safe-area-inset-left,0px));
 padding:calc(14px + env(safe-area-inset-top,0px)) calc(14px + env(safe-area-inset-right,0px)) 10px calc(14px + env(safe-area-inset-left,0px));
 background:var(--bg);border-bottom:1px solid var(--line)}
.tbBack{flex:0 0 auto;min-width:52px;color:var(--sub);text-decoration:none;font-size:15px;white-space:nowrap}
.ttitle{flex:1;min-width:0;font-size:18px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tspace{flex:0 0 52px}
.topbar h1{font-size:22px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hbtn{border:1.5px solid var(--acc);color:var(--accBtn);background:#fff;border-radius:999px;padding:0 16px;height:46px;font-size:15px;font-family:inherit;cursor:pointer;white-space:nowrap}
.coGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.coCard{border:1px solid var(--line);border-radius:14px;background:#fff;padding:12px 10px 11px;text-align:center;position:relative;
 -webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.coDot{position:absolute;top:8px;right:8px;width:30px;height:30px;border-radius:50%;background:#CED4DA;
 display:flex;align-items:center;justify-content:center;z-index:2}
.coDot.ok{background:var(--ok)}
.coDot.ok i{font-style:normal;font-size:14px;font-weight:700;color:#fff;line-height:1}
.coDot.prog{background:#fff}
.coDot.prog svg{position:absolute;inset:-2px;width:34px;height:34px}
.coDot.prog b{position:relative;font-size:9px;font-weight:700;color:#087F5B}
.coCard.off{opacity:.72}
.bkc{width:66px;height:88px;border-radius:11px;object-fit:cover;display:block;margin:0 auto 8px;border:0.5px solid var(--line);background:#F1F3F5}
.coName{font-size:15px;font-weight:600;line-height:1.3}
/* 难句/卡片 的课程筛选 */
.hchips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
.hchips::-webkit-scrollbar{display:none}
.hchip{flex:0 0 auto;min-height:44px;border:1.5px solid var(--line);background:#fff;color:var(--sub);border-radius:999px;padding:0 14px;font-size:14.5px;font-family:inherit;cursor:pointer}
.hchip.on{border-color:var(--acc);background:var(--acc);color:#fff}
.hchip i{font-style:normal;font-size:13px;opacity:.8;margin-left:3px}
.cap{font-size:12.5px;color:var(--sub);margin-top:10px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.cap b{width:7px;height:7px;border-radius:50%;background:var(--ok);display:inline-block;flex:0 0 7px}
.cap b.no{background:#CED4DA}
.codeRow{display:flex;gap:8px}
.codeRow input{flex:1;min-width:0;height:50px;border:1.5px solid var(--line);border-radius:12px;padding:0 14px;font-size:16px;outline:none;background:#FBFCFD;text-transform:uppercase}
.stepper .st{flex:1;text-align:center;font-size:15px;padding:11px 2px;border-radius:10px;background:#F1F3F5;color:var(--sub)}
.stepper .st.on{color:#fff;font-weight:600}
.stepper .st.ok{background:#E6FCF5;color:#087F5B}
.stepper .st.s0.on{background:var(--stage1)}.stepper .st.s1.on{background:var(--stage2)}
.stepper .st.s2.on{background:var(--stage3)}.stepper .st.s3.on{background:var(--stage4)}
/* 跟读台 */
.shadow{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-top:12px}
.shadow .big{font-size:19px;font-family:Georgia,serif;margin:8px 0}
.shadow .cnt{display:flex;gap:6px;align-items:center;margin:10px 0;flex-wrap:wrap}
.rec{width:64px;height:64px;border-radius:50%;border:0;background:var(--rd,#E03131);color:#fff;font-size:24px;cursor:pointer}
.rec.recording{animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.55}}
.ab{display:flex;gap:8px;margin:10px 0}
.stars{font-size:24px;cursor:pointer;user-select:none;letter-spacing:4px}
.stars i{font-style:normal;color:#CED4DA}.stars i.on{color:var(--warn)}
.grade{font-size:14px;margin-top:6px}
.bar{height:8px;border-radius:999px;background:#EDF2F7;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok)}
.card{perspective:900px;min-height:190px;margin:10px 0}
.card .in{position:relative;width:100%;transform-style:preserve-3d;transition:transform .45s;cursor:pointer}
.card.flip .in{transform:rotateY(180deg)}
.card .f,.card .b{backface-visibility:hidden;border-radius:16px;border:1px solid var(--line);
 display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px;text-align:center}
.card .f{position:relative;background:#fff;min-height:190px}
.card .b{position:absolute;inset:0;background:#F0F4FF;transform:rotateY(180deg);overflow-y:auto}
/* 闪卡背面三图标：语境重听 / 没记住 / 记住了 */
.cico{width:52px;height:52px;border-radius:50%;border:1.5px solid var(--line);background:#fff;
 display:inline-flex;align-items:center;justify-content:center;cursor:pointer;padding:0;color:var(--accBtn);flex:0 0 52px}
.cico svg{width:24px;height:24px}
.cico.no{color:var(--bad);border-color:#F1BFC0;background:#FFF5F5}
.cico.ok{color:var(--ok);border-color:#B7E4CE;background:#F0FFF9}
.ring{width:110px}
.ring text{font-weight:700}
.foot{color:var(--sub);font-size:12px;text-align:center;margin-top:14px}
audio{width:100%}
@media (hover:none){.btn:active,.play:active,.star:active,nav.tabs a:active{transform:scale(.96)}}
@media (hover:hover){.btn:hover,.play:hover{filter:brightness(1.05)}}
.skel{height:16px;border-radius:8px;margin:10px 0;background:linear-gradient(90deg,#EEF0F3 25%,#F8F9FA 45%,#EEF0F3 65%);background-size:200% 100%;animation:skm 1.2s infinite}
@keyframes skm{to{background-position:-200% 0}}
@media (orientation:landscape) and (min-width:1000px){ .wrap{max-width:1100px} .wrap .sec{max-width:920px;margin-left:auto;margin-right:auto} }
@media print{nav.tabs{display:none}}
</style>

<script>
/* ===== 会话与页内登录（学生）：不登录可学习（仅本地），登录后数据上云 ===== */
(function(){
  var SB='https://zwatrfbqkrvxpqtypdgx.supabase.co';
  var KEY='sb_publishable_mnkBBrHF70guvwfUNXuhBg_sIok8eBc';
  var BOARD='https://workbuddy.link/p/5IJWFXAquhgIqOoyYLsimE';
  var TEACHER='teacher.html';
  function esc(x){ return String(x==null?'':x).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
  var s=null; try{ s=JSON.parse(localStorage.getItem('el2_session')||'null'); }catch(e){}
  if(s && (s.role!=='kid' || (s.expires_at||0)<Date.now())) s=null;   /* 仅接受有效学生会话 */
  window.EL2SESS=s;
  function save(){ try{ localStorage.setItem('el2_session',JSON.stringify(s)); }catch(e){} window.EL2SESS=s; }
  window.el2Refresh=function(){
    if(!s) return Promise.resolve(null);
    if(Date.now() < s.expires_at - 60000) return Promise.resolve(s.access_token);
    if(!navigator.onLine) return Promise.resolve(s.access_token);
    return fetch(SB+'/auth/v1/token?grant_type=refresh_token',{
      method:'POST', headers:{'apikey':KEY,'Content-Type':'application/json'},
      body:JSON.stringify({refresh_token:s.refresh_token})
    }).then(function(r){ return r.json(); }).then(function(d){
      if(d&&d.access_token){
        s.access_token=d.access_token; s.refresh_token=d.refresh_token;
        s.expires_at=Date.now()+(d.expires_in||3600)*1000; save();
        return s.access_token;
      }
      s=null; save(); renderBar();   /* 刷新失败即视为未登录 */
      return null;
    }).catch(function(){ return null; });
  };
  /* 旧会话迁移：补 uid / family_code */
  if(s && (!s.uid || !s.family_code) && navigator.onLine){
    fetch(SB+'/auth/v1/user',{headers:{'apikey':KEY,'Authorization':'Bearer '+s.access_token}})
      .then(function(r){ return r.ok?r.json():null; })
      .then(function(u){ if(u&&u.id){ s.uid=u.id; if(!s.email&&u.email) s.email=u.email; return api2('/rest/v1/el2_accounts?select=role,family_code'); } return null; })
      .then(function(rows){ if(rows&&rows[0]&&rows[0].family_code){ s.family_code=rows[0].family_code; save(); } })
      .catch(function(){});
    function api2(path){ return fetch(SB+path,{headers:{'apikey':KEY,'Authorization':'Bearer '+s.access_token}}).then(function(r){ return r.json(); }); }
  }

  /* 顶栏 + 登录弹窗 */
  var css=document.createElement('style');
  css.textContent=''
    +''
    +''
    +'#loginMask{position:fixed;inset:0;background:rgba(33,37,41,.45);z-index:1000;display:flex;align-items:center;justify-content:center;padding:20px}'
    +'#loginMask .lmCard{position:relative;background:#fff;border-radius:18px;padding:24px 22px;width:100%;max-width:min(400px,92vw);box-shadow:0 18px 50px rgba(0,0,0,.25)}'
    +'#loginMask h3{font-size:20px;margin-bottom:2px}#loginMask .sub{font-size:14px;color:#6C757D;margin-bottom:10px}'
    +'#loginMask label{display:block;font-size:14px;font-weight:600;margin:10px 0 5px}'
    +'#loginMask input{width:100%;height:52px;border:1.5px solid #E9ECEF;border-radius:12px;padding:0 14px;font-size:17px;outline:none;background:#FBFCFD}'
    +'#loginMask input:focus{border-color:#3B5BDB;background:#fff}'
    +'#loginMask .go{width:100%;height:54px;border:0;border-radius:13px;background:#3B5BDB;color:#fff;font-size:17px;font-weight:700;margin-top:16px;cursor:pointer}'
    +'#loginMask .err{color:#E03131;font-size:14px;min-height:18px;margin-top:8px;text-align:center}'
    +'#loginMask.kb .lmCard{padding:14px 18px;max-height:62vh;overflow-y:auto}'
    +'#loginMask.kb .sub{display:none}#loginMask.kb h3{margin-bottom:0}'
    +'#loginMask.kb{align-items:flex-start;padding-top:calc(48px + env(safe-area-inset-top,0px))}'
    +'#loginMask .x{position:absolute;top:10px;right:12px;border:0;background:none;font-size:20px;color:#6C757D;cursor:pointer}';
  document.head.appendChild(css);
  var mask=document.createElement('div'); mask.id='loginMask'; mask.style.display='none';
  mask.innerHTML='<div class="lmCard">'
    +'<button class="x" id="lmx" title="关闭">×</button>'
    +'<h3>学生登录</h3><div class="sub">登录后学习记录同步给家长与老师</div>'
    +'<label for="lmEm">账号邮箱</label><input id="lmEm" type="email" autocomplete="username">'
    +'<label for="lmPw">密码</label><input id="lmPw" type="password" autocomplete="current-password">'
    +'<button class="go" id="lmGo">登 录</button><div class="err" id="lmErr"></div></div>';
  document.body.appendChild(mask);
  mask.querySelectorAll('input').forEach(function(inp){
    inp.addEventListener('focus',function(){ mask.classList.add('kb'); });
    inp.addEventListener('blur',function(){ mask.classList.remove('kb'); });
  });
  function closeMask(){ mask.style.display='none'; mask.classList.remove('kb'); }
  mask.querySelector('#lmx').addEventListener('click',closeMask);
  mask.addEventListener('click',function(e){ if(e.target===mask) closeMask(); });
  window.el2OpenLogin=function(){ mask.style.display='flex'; };
  window.el2Logout=function(){
    if(!window.confirm('退出登录？退出后学习记录将停止同步（本机进度保留）')) return;
    try{ localStorage.removeItem('el2_session'); }catch(e){}
    window.EL2SESS=null;
    if(typeof window.el2AuthChanged==='function') window.el2AuthChanged();
    else if(typeof nav==='function') nav();
  };
  mask.querySelector('#lmGo').addEventListener('click',function(){
    var err=mask.querySelector('#lmErr'), go=mask.querySelector('#lmGo');
    var em=mask.querySelector('#lmEm').value.trim().toLowerCase(), pw=mask.querySelector('#lmPw').value;
    err.textContent=''; go.disabled=true; go.textContent='登录中…';
    fetch(SB+'/auth/v1/token?grant_type=password',{method:'POST',
      headers:{'apikey':KEY,'Authorization':'Bearer '+KEY,'Content-Type':'application/json'},
      body:JSON.stringify({email:em,password:pw})})
    .then(function(r){ return r.json().then(function(d){ return {ok:r.ok,d:d}; }); })
    .then(function(res){
      if(!res.ok||!res.d.access_token){ throw new Error(res.d.error_description||res.d.msg||'登录失败'); }
      return fetch(SB+'/rest/v1/el2_accounts?uid=eq.'+encodeURIComponent(res.d.user.id)+'&select=role,family_code',{headers:{'apikey':KEY,'Authorization':'Bearer '+res.d.access_token}})
        .then(function(r){ return r.json(); })
        .then(function(rows){
          var row=rows&&rows[0];
          if(!row||!row.role){ throw new Error('该账号未配置角色'); }
          if(row.role==='kid'){
            s={access_token:res.d.access_token,refresh_token:res.d.refresh_token,
               expires_at:Date.now()+(res.d.expires_in||3600)*1000,role:'kid',
               family_code:row.family_code||'',uid:res.d.user?res.d.user.id:'',email:em};
            save(); closeMask(); if(typeof window.el2AuthChanged==='function') window.el2AuthChanged(); else if(typeof nav==='function') nav();
            var _g=document.getElementById('lmGo'); if(_g){ _g.disabled=false; _g.textContent='登 录'; }
          }else if(row.role==='teacher'){
            location.replace(TEACHER+'#t='+encodeURIComponent(res.d.access_token));
          }else{
            location.replace(BOARD+'#t='+encodeURIComponent(res.d.access_token)+'&f='+encodeURIComponent(row.family_code||''));
          }
        });
    })

<script>

/* ===== 进度存储 v3：按课程分组 {_v:3, courses:{nce2:{"1":{…}}}} =====
   v3 前是扁平 {课号:记录}——第二门课一接入就会与 NCE2 同课号写成同一条记录（静默互串）。
   迁移在读取时做一次，对同一份旧数据幂等；旧数据全部归属默认课程。 */
const DEF_COURSE='nce2';
function blankProg(){ return {stage:0,si:0,listened:{},shadow:{},hard:[],firstLearnAt:0,reviews:0,lastReviewAt:0,blindDone:false,retellDone:false}; }
function migrateProg(raw){
  if(!raw||typeof raw!=='object') return {_v:3,courses:{}};
  if(raw._v===3&&raw.courses){
    /* 兜底：旧版 JS（缓存未更新）仍按扁平结构写入时，把它并回默认课程，别丢数据 */
    const stray=Object.keys(raw).filter(k=>/^\d+$/.test(k));
    if(stray.length){
      const o=raw.courses[DEF_COURSE]||(raw.courses[DEF_COURSE]={});
      stray.forEach(k=>{ o[k]=raw[k]; delete raw[k]; });
    }
    return raw;
  }
  const inner={};
  for(const k in raw){ if(/^\d+$/.test(k)&&raw[k]&&typeof raw[k]==='object') inner[k]=raw[k]; }
  /* 先补跑 v2 顺序迁移：旧顺序[精听0,跟读1,盲听2,复述3] → 新顺序[盲听0,跟读1,精听2,复述3] */
  if(!raw.__v2){ for(const k in inner){ const q=inner[k];
    if(typeof q.stage==='number'){ if(q.stage===0)q.stage=2; else if(q.stage===2)q.stage=0; } } }
  return {_v:3,courses:{[DEF_COURSE]:inner}};
}

/* 单课程汇总：已学 / 通关 / 复习轮数 / 最近课号 / 继续目标 */
function progStat(cid){
  const o=progOf(cid), ks=Object.keys(o);
  let learned=0,done=0,rounds=0,best=-1,cont=0,last=0;
  ks.forEach(k=>{ const p=o[k]||{}; const sc=(p.stage||0)*100+(p.si||0);
    if(sc>best){best=sc;cont=+k;}
    if(p.firstLearnAt){ learned++; if(p.reviews>=OFFSETS.length) done++; rounds+=(p.reviews||0);
      if(+k>last) last=+k; } });
  return {learned,done,rounds,cont,last};
}

  const ids=(typeof myCourses==='function')?myCourses():Object.keys(PROG.courses||{});

/* 难句/卡片 的课程范围（内存态，不持久化）——方案 C：跟随 + 状态外显

   · 在「难句 ↔ 卡片」之间来回切 → 沿用当前选择，不打断刚做的筛选
   筛选条出现条件：有 ≥2 门课有难句，或已选中某门课（保证单课程时也能切回「全部」） */
let HARDF='all', LAST_HASH='';

  const prev=LAST_HASH||'';
  if(prev.startsWith('#/hard')||prev.startsWith('#/cards')) return;
  if(prev.startsWith('#/c/')){ HARDF=decodeURIComponent(prev.slice(4).split('?')[0])||DEF_COURSE; return; }
  if(prev.startsWith('#/lesson/')){ const Q=hashQs(); HARDF=Q.c||CUR.course||curCourse()||DEF_COURSE; return; }
  HARDF='all';
}
function hardList(){
  const a=hardAll();
  return HARDF==='all'?a:a.filter(x=>(x.cid||DEF_COURSE)===HARDF);
}
function hardChips(){
  const a=hardAll();
  const cids=[...new Set(a.map(x=>x.cid||DEF_COURSE))];
  if(cids.length<2 && HARDF==='all') return '';          /* 单课程且未筛选 → 不制造无意义控件 */
  if(HARDF!=='all' && cids.indexOf(HARDF)<0) cids.push(HARDF);  /* 选中的课暂时没难句也要能切回来 */
  const cnt=id=>a.filter(x=>(x.cid||DEF_COURSE)===id).length;
  const chip=(v,label,n)=>`<button class="hchip${HARDF===v?' on':''}" data-act="hardf" data-v="${v}">${label}<i>${n}</i></button>`;
  return `<div class="hchips">${chip('all','全部',a.length)}`+
    cids.map(id=>{ const c=catCourse(id)||{}; return chip(id,c.short||id,cnt(id)); }).join('')+`</div>`;
}
/* 难句本：v3 前没有 cid 字段（只可能是 NCE2），读取时补默认课程 */
function hardAll(){

  a.forEach(x=>{ if(!x.cid){ x.cid=DEF_COURSE; ch=true; } });
  if(ch){ try{ store.setHard(a); }catch(e){} }
  return a;
}

/* 复习调度：nextDue(no) → 毫秒时间戳；dueRound(no) → 第几轮(1-7) 或 0 */
function nextDue(p){
  if(!p.firstLearnAt||p.reviews>=OFFSETS.length) return 0;
  return p.firstLearnAt+OFFSETS[p.reviews]*864e5;
}
/* cid 省略 = 全部课程（首页聚合）；给了就只看这一门 */
function dueList(cid){
  const now=Date.now(),out=[];
  const cs=cid?[cid]:((typeof myCourses==='function')?myCourses():Object.keys(PROG.courses||{}));
  cs.forEach(c=>{ const o=(PROG.courses||{})[c]||{};
    for(const k in o){ const p=o[k];
      if(!p.firstLearnAt) continue;
      const nd=nextDue(p);
      if(nd&&now>=nd) out.push({cid:c,no:+k,round:p.reviews+1,due:nd,overdueDays:Math.floor((now-nd)/864e5)});
    } });
  out.sort((a,b)=>a.due-b.due); return out;
}

/* 统计 */
function statDay(sec){ const d=todayStr(); STATS.playSec=(STATS.playSec||0)+sec;
  STATS.days[d]=(STATS.days[d]||0)+sec; saveStats();

let IDB=null;
function idb(){ if(IDB) return Promise.resolve(IDB);
  return new Promise((res,rej)=>{
    const rq=indexedDB.open('el2rec',1);
    rq.onupgradeneeded=()=>rq.result.createObjectStore('r');
    rq.onsuccess=()=>{IDB=rq.result;res(IDB);}; rq.onerror=()=>rej(rq.error);
  });
}
async function recSave(key,blob){ try{ const db=await idb();
  await new Promise((res,rej)=>{const tx=db.transaction('r','readwrite');tx.objectStore('r').put(blob,key);tx.oncomplete=res;tx.onerror=rej;});
}catch(e){} }
async function recLoad(key){ try{ const db=await idb();
  return await new Promise((res)=>{const tx=db.transaction('r','readonly');const q=tx.objectStore('r').get(key);
    q.onsuccess=()=>res(q.result||null); q.onerror=()=>res(null);});

const AU=$('#au'); let segStop=null,playT0=0;
function audioSrcOf(a){ return /^audio\//.test(a) ? a : 'audio/'+a; }
function curAudio(){ return audioSrcOf((CUR.data||{}).audio); }
function playSeg(t,t2,onend,src){
  AU.src=src||curAudio(); AU.currentTime=t; AU.play();
  playT0=Date.now();
  if(segRaf){ cancelAnimationFrame(segRaf); segRaf=null; }
  if(segStop) AU.removeEventListener('timeupdate',segStop);
  /* rAF 轮询（~16ms）替代 timeupdate（~250ms）：句尾过冲从 0.25s 降到 0.02s，
     避免下一句起音漏进本句（L1 "interesting."/"I" 边界实测余量仅 0.12s） */
  const step=()=>{
    if(AU.paused){ segRaf=null; return; }
    if(AU.currentTime>=t2){
      AU.pause(); segRaf=null;
      statDay((Date.now()-playT0)/1000); if(onend)onend();
      return;
    }
    segRaf=requestAnimationFrame(step);
  };
  segRaf=requestAnimationFrame(step);
}
let segRaf=null;
function playAll(onend){ AU.src=curAudio(); AU.currentTime=0; AU.play(); playT0=Date.now();
  if(segRaf){ cancelAnimationFrame(segRaf); segRaf=null; }

  segStop=()=>{ if(AU.ended){ AU.removeEventListener('timeupdate',segStop); statDay((Date.now()-playT0)/1000); if(onend)onend(); } };

}

async function router(){

      CUR.data=await loadLesson(no,cid);

  else if(h.startsWith('#/cards')) renderCards();
  else if(h.startsWith('#/stats')) renderMe();      /* 旧地址兼容：#/stats 并入「我的」 */
  else if(h.startsWith('#/me')) renderMe();
  else if(h.startsWith('#/store')) renderStore();
  else if(h.startsWith('#/c/')){
    /* 通用课程内页：第二门课 ready 后这里直接生效，无需再改路由 */

}

/* 储存条：离线占用（已下载课程体积和）+ 设备配额 */
function fillStorage(){
  const el=document.getElementById('stgLine'); if(!el) return;
  let used=0, n=0;
  myCourses().forEach(id=>{ const st=dlGet(id); if(st&&st.state==='done'){ const c=catCourse(id); used+=(c?c.sizeMB:0); n++; } });
  const dot=`<b class="${n?'':'no'}"></b>`;
  if(!navigator.storage||!navigator.storage.estimate){ el.innerHTML=dot+(n?`离线 ${n} 门 · 约 ${used}MB`:'暂无离线课程'); return; }
  navigator.storage.estimate().then(ev=>{
    const free=Math.round(((ev.quota||0)-(ev.usage||0))/1048576);
    el.innerHTML=dot+(n?`离线 ${n} 门 · 已用 ${used}MB`:'暂无离线课程')+(free>0?` · 设备可用 ${free>=1024?(free/1024).toFixed(1)+'GB':free+'MB'}`:'');
  }).catch(()=>{ el.innerHTML=dot+(n?`离线 ${n} 门 · 已用 ${used}MB`:'暂无离线课程'); });
}

/* 卡片右上角状态圆点：灰=未下载 · 绿环+%=下载中/暂停续传 · 绿底✓=就绪（筹备中常灰） */
function coDot(c){
  const st=dlGet(c.id), pct=dlPct(c.id);
  const added=myCourses().indexOf(c.id)>=0;
  const ready=!!(st&&st.state==='done'), run=!!(st&&st.state==='run');
  if(!c.ready) return '<span class="coDot" title="筹备中"></span>';
  if(ready) return '<span class="coDot ok"><i>✓</i></span>';
  if(run||(st&&st.state==='pause'&&pct>0)){
    const C=2*Math.PI*15, off=(C*(1-pct/100)).toFixed(1);
    return `<span class="coDot prog"><svg viewBox="0 0 36 36"><circle cx="18" cy="18" r="15" fill="none" stroke="#E9ECEF" stroke-width="4"/><circle cx="18" cy="18" r="15" fill="none" stroke="#12B886" stroke-width="4" stroke-linecap="round" stroke-dasharray="${C.toFixed(1)}" stroke-dashoffset="${off}" transform="rotate(-90 18 18)"/></svg><b>${pct}</b></span>`;
  }
  return '<span class="coDot" title="未下载"></span>';
}

(function(){
  let t=null, fired=null, sx=0, sy=0;
  document.addEventListener('pointerdown',e=>{
    const el=e.target.closest('.coCard[data-c]'); if(!el) return;
    sx=e.clientX; sy=e.clientY; fired=null;
    t=setTimeout(()=>{ t=null; fired=el; rmCourse(el.dataset.c); },600);
  });
  ['pointerup','pointercancel'].forEach(ev=>document.addEventListener(ev,()=>{ if(t){ clearTimeout(t); t=null; } }));
  document.addEventListener('pointermove',e=>{
    if(t&&(Math.abs(e.clientX-sx)>10||Math.abs(e.clientY-sy)>10)){ clearTimeout(t); t=null; }
  });
  document.addEventListener('contextmenu',e=>{ if(e.target.closest('.coCard[data-c]')) e.preventDefault(); });
  document.addEventListener('click',e=>{
    if(fired){ e.stopPropagation(); e.preventDefault(); fired=null; }
  },true);
})();

let REC=null,RECCHUNKS=[];
function refreshStage(){ renderStage(); }

document.addEventListener('click',async e=>{
  const el=e.target.closest('[data-act]');
  if(!el||!CUR.data) return;
  const act=el.dataset.act, i=+el.dataset.i, p=prog(CUR.no), d=CUR.data;
  const cid=curCourse();
  const rev=CUR.mode==='rev';   /* P0 修复：rev 从未定义，plays 点击必抛 ReferenceError（自 f52a179 潜伏） */
  if(act==='plays'){
    const s=d.sentences[i];
    if(p.stage===1||el.closest('.shadow')){
      CUR.loopsLeft=CUR.loopsLeft??CUR.loops;
      const once=()=>{ CUR.loopsLeft--; const ll=$('#loopLeft'); if(ll) ll.textContent='剩 '+Math.max(CUR.loopsLeft,0)+' 遍';
        if(CUR.loopsLeft>0){ playSeg(s.t,s.t2,once); } else { CUR.loopsLeft=CUR.loops; } };
      playSeg(s.t,s.t2,once);
    }else{
      playSeg(s.t,s.t2);
    }
    const zz=$('#zh'+i); if(zz) zz.style.display='block';
        if(!rev){ p.si=i; if(CUR.si!=null)CUR.si=i; if(p.stage===2){ p.listened[i]=1; saveProgress(); const bt=el.closest('.sent'); if(bt&&bt.querySelector('.play'))bt.querySelector('.play').style.background='var(--accBtn)'; } else saveProgress(); }
    else saveProgress();
  }
  else if(act==='det'){ const z=$('#zh'+i),dt=$('#det'+i); if(z)z.style.display=z.style.display==='none'?'block':'none'; if(dt)dt.style.display=dt.style.display==='none'?'block':'none'; }
  else if(act==='star'){
    const arr=p.hard, ix=arr.indexOf(i);
    if(ix>=0){arr.splice(ix,1); store.setHard(hardAll().filter(x=>!(x.cid===cid&&x.no===CUR.no&&x.i===i)));}
    else{arr.push(i); const s=d.sentences[i]; const hard=hardAll(); hard.unshift({cid,no:CUR.no,i,en:s.en,zh:s.zh,pat:s.pat||'',ts:Date.now()}); store.setHard(hard);}
    saveProgress(); el.classList.toggle('on');
  }
  else if(act==='loop'){ CUR.loops=+el.dataset.v; CUR.loopsLeft=CUR.loops; refreshStage(); }
  else if(act==='ps'){ if(CUR.si>0){CUR.si--;CUR.blob=null;CUR.grade='';refreshStage();} }
  else if(act==='ns'){ if(CUR.si<d.sentences.length-1){CUR.si++;CUR.blob=null;CUR.grade='';refreshStage();} }
  else if(act==='rate'){ p.shadow[CUR.si]=+el.dataset.v; STATS.shadowN=(STATS.shadowN||0)+1; saveProgress(); saveStats(); syncEnqueue('shadow',0,+el.dataset.v); refreshStage(); }
  else if(act==='aborig'){ const s=d.sentences[CUR.si??i]; playSeg(s.t,s.t2); }
  else if(act==='abmine'){ if(CUR.blob){ AU.pause(); AU.src=URL.createObjectURL(CUR.blob); AU.play(); } }
  else if(act==='rec'){
    if(REC&&REC.state==='recording'){ REC.stop(); return; }
    try{
      const stream=await navigator.mediaDevices.getUserMedia({audio:true});
      RECCHUNKS=[]; REC=new MediaRecorder(stream);
      REC.ondataavailable=ev=>RECCHUNKS.push(ev.data);
      REC.onstop=()=>{
        stream.getTracks().forEach(t=>t.stop());
        CUR.blob=new Blob(RECCHUNKS,{type:REC.mimeType||'audio/webm'});
        const key=el.dataset.retell?`${cid}_${CUR.no}_retell`:`${cid}_${CUR.no}_s${CUR.si}`;
        recSave(key,CUR.blob);
        STATS.recN=(STATS.recN||0)+1; saveStats();
        el.textContent='● 录跟读'; el.classList.remove('recording');
        const rs=$('#recState'); if(rs)rs.textContent='已录 ✓（重新录会覆盖）';
        const bm=$('#btnMine'); if(bm)bm.disabled=false;
      };
      REC.start(); el.textContent='■ 停止'; el.classList.add('recording');
    }catch(err){ alert('麦克风不可用：'+err.message); }
  }
  else if(act==='stt'){
    if(!SR) return;
    const target=d.sentences[CUR.si].en, btn=$('#btnStt');
    btn.disabled=true; btn.textContent='聆听中…';
    try{
      const r=new SR(); r.lang='en-US'; r.interimResults=false; r.maxAlternatives=1;
      r.onresult=ev=>{ const said=ev.results[0][0].transcript;
        const norm=s=>s.toLowerCase().replace(/[^a-z' ]/g,'').split(/\s+/).filter(Boolean);
        const tw=norm(target), sw=new Set(norm(said));
        const hit=tw.filter(w=>sw.has(w)).length, ratio=hit/tw.length;
        const grade=ratio>=0.85?'A':ratio>=0.65?'B':'C';
        CUR.grade=`识别：「${said}」<br>命中 ${hit}/${tw.length} 词（${Math.round(ratio*100)}%）→ 评级 <b>${grade}</b>`;
        const g=$('#grade'); if(g)g.innerHTML=CUR.grade;
      };
      r.onerror=ev=>{ CUR.grade='识别失败（'+ev.error+'）。Chrome 识别需联网；Safari/iOS 暂不支持，请用自评。';
        const g=$('#grade'); if(g)g.textContent=CUR.grade; };
      r.onend=()=>{ btn.disabled=false; btn.textContent='识别评分'; };
      r.start();
    }catch(err){ btn.disabled=false; btn.textContent='识别评分'; }
  }
  else if(act==='tostage'){ if(CUR.mode==='rev'){CUR.rstep=+el.dataset.v;} else {p.stage=+el.dataset.v; p.si=CUR.si??p.si; saveProgress();} CUR.blob=null; CUR.grade=''; CUR.loopsLeft=null; renderLesson(); }
  else if(act==='jump'){
    if(rev) CUR.rstep=+el.dataset.v; else { p.stage=+el.dataset.v; saveProgress(); }
    renderLesson();
  }
  else if(act==='reveal'){ const b=$('#blindBox'); b.classList.toggle('blur'); el.textContent=b.classList.contains('blur')?'👁 揭晓字幕':'🙈 重新遮上'; }
  else if(act==='blinddone'){ p.blindDone=el.checked; saveProgress(); }
  else if(act==='retelldone'){ p.retellDone=el.checked; saveProgress(); syncEnqueue('retell',0,null); }
  else if(act==='fin'){
    p.firstLearnAt=Date.now(); p.stage=3; saveProgress(); renderLesson();
  }
  else if(act==='revfin'){
    p.reviews=Math.min(p.reviews+1,OFFSETS.length); p.lastReviewAt=Date.now(); saveProgress();
    location.hash='#/home';
  }
  else if(act==='playall'){ playAll(); }
});

        <div class="meta">登录后学习记录同步给家长和老师；不登录也能学。</div></div>
        <button class="btn sm" data-act="melogin">登录</button></div></div>`;
  }
  /* ② 学习概览 */
  h+=`<div class="sec"><h2>学习概览</h2>
    <div style="display:flex;justify-content:space-around">
      ${ringSvg('a',Math.round(learned*100/totLearn),'#4C6EF5','已学')}${ringSvg('b',Math.round(done*100/totLearn),'#12B886','通关')}${ringSvg('c',learned?Math.min(100,Math.round(rounds*100/(learned*7))):0,'#F59F00','复习')}</div>
    <div class="tip" style="text-align:center;margin-top:6px">已学 ${learned}/${totLearn} · 通关 ${done}/${totLearn} · 复习 ${rounds} 轮 · 待复习 ${due} 课</div></div>`;
  /* ③ 近 7 天 */
  h+=`<div class="sec"><h2>近 7 天练习（分钟）</h2>
    <div style="display:flex;align-items:flex-end;gap:8px;height:120px;padding:0 4px">
      ${days.map(x=>`<div style="flex:1;text-align:center"><div style="font-size:12px;color:var(--sub)">${x.v||''}</div>
        <div style="background:var(--acc);border-radius:6px 6px 0 0;height:${Math.round(x.v/max*88)}px;min-height:3px"></div>
        <div style="font-size:12px;color:var(--sub)">${x.label}</div></div>`).join('')}
    </div>
    <div class="item" style="margin-top:10px"><div class="tt">累计收听</div><b>${mins} 分钟</b></div>
    <div class="item"><div class="tt">跟读句子次数</div><b>${STATS.shadowN||0}</b></div>
    <div class="item"><div class="tt">录音次数</div><b>${STATS.recN||0}</b></div></div>`;
  /* ④ 离线包：按「我的课程」逐门列，操作就地完成 */
  h+=`<div class="sec"><h2>离线包 ${tipQ('ofl','下载后断网也能学。在课程库里点「移除」只释放文件，学习进度与难句本都会保留。')}</h2>
    ${my.map(id=>catCourse(id)).filter(c=>c&&c.ready).map(meOfflineRow).join('')||'<div class="empty">还没有可下载的课程</div>'}
    <div class="tip" style="margin-top:8px">已下载 ${readyCs.length} 门 · 约 ${readyMB}MB</div>
    <div style="margin-top:8px"><button class="btn sm g" data-go="#/store">去课程库管理</button></div></div>`;
  /* ⑤ 数据管理（打印时排除） */
  h+=`<div class="sec no-print"><h2>数据管理</h2><div class="tip">换新平板前，先点「导出备份」保存记录。</div>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <button class="btn sm g" data-act="exp">导出 JSON 备份</button>
      <button class="btn sm g" data-act="imp">导入恢复</button>
      <input type="file" id="impFile" accept=".json" style="display:none">
      <button class="btn sm g" data-act="clr">清空全部记录</button></div></div>
  <div class="foot">配套训练工具 · 更多课程在课程库里</div>`;
  $('#app').innerHTML=h;
  const b=document.getElementById('meOut2');
  if(b) b.addEventListener('click',()=>{ if(window.el2Logout) window.el2Logout(); });
}
/* 登录态变化（登录/退出）→ 顶部 tab 与「我的」页同步刷新 */
window.el2AuthChanged=function(){ nav(); const hh=location.hash||'#/home';
  if(hh.startsWith('#/me')||hh.startsWith('#/stats')) renderMe(); };
/* ===== 课程离线包：按课程下载进 el2-content 缓存层（设备级，不依赖登录） ===== */
const CACHE_CONTENT='el2-content';
const DL={};                       /* 运行期进度缓存，避免每次渲染都读 localStorage */
const DLSTOP={};                   /* 每门课的暂停旗标：下载循环每步检查，不靠状态字段自欺 */
function dlMap(){ try{ return JSON.parse(localStorage.getItem(LS+'dl')||'{}'); }catch(e){ return {}; } }
function dlGet(id){ if(DL[id]) return DL[id]; const m=dlMap(); return m[id]||null; }
function dlSet(id,v){
  if(v===null){ delete DL[id]; const m=dlMap(); delete m[id]; try{ localStorage.setItem(LS+'dl',JSON.stringify(m)); }catch(e){} return; }
  DL[id]=v; const m=dlMap(); m[id]=v; try{ localStorage.setItem(LS+'dl',JSON.stringify(m)); }catch(e){}
}
function dlPct(id){ const s=dlGet(id); if(!s||!s.total) return 0; return Math.max(0,Math.min(100,Math.round(s.done*100/s.total))); }
function courseFiles(c){
  const n=+c.lessons||0, out=[];
  for(let i=1;i<=n;i++){ const k=String(i).padStart(c.pad||2,'0');
    if(c.dataPat) out.push(c.dataPat.replace('{NN}',k));
    if(c.audioPat) out.push(c.audioPat.replace('{NN}',k)); }
  return out;
}
/* 旧版一键离线包（只存了 el2_offline 标记）→ 迁移成 nce2 已就绪，不让老用户白下一遍 */
(function(){ try{
  if(localStorage.getItem('el2_offline')&&!dlGet('nce2')){
    const n=courseFiles(catCourse('nce2')||{lessons:96}).length;
    dlSet('nce2',{done:n,total:n,state:'done'});
  }
}catch(e){} })();
async function dlCourse(id){
  const c=catCourse(id); if(!c||!c.ready) return;
  const prev=dlGet(id); if(prev&&prev.state==='run'&&!DLSTOP[id]) return;
  const files=courseFiles(c);
  const st={done:(prev&&prev.state!=='done')?Math.min(prev.done||0,files.length):0,total:files.length,state:'run'};
  DLSTOP[id]=0; dlSet(id,st); paintDl(id);
  /* 申请持久化存储，避免系统清理掉几十 MB 的离线包 */
  if(navigator.storage&&navigator.storage.persist){ try{ navigator.storage.persist(); }catch(e){} }
  let cache; try{ cache=await caches.open(CACHE_CONTENT); }
  catch(e){ dlSet(id,Object.assign({},st,{state:'fail'})); paintDl(id); return; }
  for(let i=st.done;i<files.length;i++){
    if(DLSTOP[id]) return;                                       /* 暂停 / 已移除 → 立即停 */
    try{
      const m=await cache.match(files[i]);
      if(!m){ const r=await fetch(files[i]); if(r&&r.ok) await cache.put(files[i],r); }
    }catch(e){}
    if(DLSTOP[id]) return;                                       /* 在途请求期间被暂停 → 不覆盖暂停态 */
    st.done=i+1; dlSet(id,st);
    if(i%4===0||i===files.length-1) paintDl(id);
  }
  dlSet(id,{done:files.length,total:files.length,state:'done'});
  paintDl(id);
}
function dlPause(id){
  const s=dlGet(id); if(s&&s.state==='run'){ DLSTOP[id]=1; dlSet(id,Object.assign({},s,{state:'pause'})); }
  paintDl(id);
}
async function rmCourse(id){
  const c=catCourse(id); if(!c) return;
  if(!confirm('从「我的课程」移除「'+c.name+'」？\n学习进度与难句本会保留，只释放离线文件（约 '+(c.sizeMB||0)+'MB）。')) return;
  dlPause(id);
  try{ const cache=await caches.open(CACHE_CONTENT);
    for(const f of courseFiles(c)){ try{ await cache.delete(f); }catch(e){} } }catch(e){}
  dlSet(id,null);
  setMyCourses(myCourses().filter(x=>x!==id));
  renderStore();
}
/* 只重绘受影响的那一格 + 进度条，避免整页闪 */
function paintDl(id){
  const c=catCourse(id); if(!c) return;
  const cell=document.getElementById('sc-'+id);
  if(cell&&document.body.contains(cell)&&cell.parentNode){ cell.outerHTML=renderStoreCard(c); }
  const row=document.getElementById('ol-'+id);          /* 「我的」页离线包那一行 */
  if(row&&document.body.contains(row)&&row.parentNode){ row.outerHTML=meOfflineRow(c); }
  refreshOlUI();
}

function refreshOlUI(){
  /* 只服务于课程首页那颗离线按钮（「我的」页的离线行由 paintDl 就地重绘） */
  const cid=(typeof curCourse==='function')?curCourse():DEF_COURSE;
  const s=dlGet(cid), hb=$('#homeOlBtn');
  if(!hb) return;
  const done=!!(s&&s.state==='done'), run=!!(s&&s.state==='run');
  hb.textContent=done?'📥 更新离线包':(run?'📥 下载中 '+dlPct(cid)+'%':'📥 下载离线包');
}
window.dlOffline=function(){
  const cid=(typeof curCourse==='function')?curCourse():DEF_COURSE;
  const s=dlGet(cid);
  if(s&&s.state==='run'){ dlPause(cid); return; }
  return dlCourse(cid);
};
/* ================= 数据管理动作 ================= */
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]'); if(!el) return;
  const act=el.dataset.act;
  /* —— 课程库 / 我的课程 —— */
  if(act==='openc'){ location.hash='#/c/'+el.dataset.c; return; }
  if(act==='stcard'){   /* 课程库极简卡：点封面 = 状态相关主操作（逻辑与原按钮一致） */
    const c=catCourse(el.dataset.c); if(!c||!c.ready) return;
    const st=dlGet(c.id);
    if(myCourses().indexOf(c.id)<0){ addCourse(c.id); dlCourse(c.id); return; }  /* 添加即下载 */
    if(st&&st.state==='run'){ dlPause(c.id); return; }                           /* 下载中 → 暂停 */
    if(st&&st.state==='done'){ location.hash='#/c/'+c.id; return; }              /* 就绪 → 打开 */
    dlCourse(c.id); return;                                                      /* 待下载/暂停 → 续传 */
  }
  if(act==='addc'){ addCourse(el.dataset.c); dlCourse(el.dataset.c); return; }
  if(act==='dlc'){ dlCourse(el.dataset.c); return; }
  if(act==='pausec'){ dlPause(el.dataset.c); return; }
  if(act==='rmc'){ rmCourse(el.dataset.c); return; }
  if(act==='codego'){
    const inp=document.getElementById('codeIn');
    const code=(inp?inp.value:'').trim().toUpperCase();
    const hit=((CATALOG.codes)||[]).filter(x=>String(x.code).toUpperCase()===code)[0];
    if(!hit){ alert('课程码无效，请核对后重试'); return; }
    const ids=(hit.add||[]).filter(id=>{ const c=catCourse(id); return !!(c&&c.ready); });
    if(!ids.length){ alert('这个课程码对应的课程还在筹备中'); return; }
    ids.forEach(id=>{ addCourse(id); dlCourse(id); });
    renderStore();
    return;
  }
  if(act==='melogin'){ if(window.el2OpenLogin) window.el2OpenLogin(); return; }
  if(act==='logout'){ localStorage.removeItem('el2_session'); location.replace('login.html'); return; }
  if(act==='revsh'){ CUR.shReveal=!CUR.shReveal; renderLesson(); return; }
  if(act==='retellhint'){ CUR.retellHint=!CUR.retellHint; renderLesson(); return; }
  if(act==='tipq'){ const dEl=document.getElementById('tipd-'+el.dataset.tk); if(dEl) dEl.style.display=dEl.style.display==='none'?'block':'none'; return; }
  if(act==='hardf'){ HARDF=el.dataset.v||'all';
    if((location.hash||'').startsWith('#/hard')) renderHard();
    else if((location.hash||'').startsWith('#/cards')) renderCards();
    return;
  }
  if(act==='cardok'||act==='cardno'){
    const hard=hardAll();
    const cid=el.dataset.c||DEF_COURSE, no=+el.dataset.no, si=+el.dataset.i;
    const it=hard.filter(x=>(x.cid||DEF_COURSE)===cid&&x.no===no&&x.i===si)[0]; if(!it) return;
    it.due = Date.now() + (act==='cardok'?3*864e5:12*36e5);
    store.setHard(hard);
    const cd=el.closest('.card'); cd.classList.remove('flip'); cd.style.opacity=.4; cd.style.pointerEvents='none';
    return;
  }
  if(act==='flip'){ el.classList.toggle('flip'); }
  else if(act==='goSent'){
    const c = el.dataset.c||DEF_COURSE;
    location.hash=lessonHref(+el.dataset.no,c);
    CUR.afterRender=()=>{ prog(+el.dataset.no,c).stage=0; renderLesson(); };
  }
  else if(act==='unstar'){
    const cid=el.dataset.c||DEF_COURSE, no=+el.dataset.no, si=+el.dataset.i;
    store.setHard(hardAll().filter(x=>!((x.cid||DEF_COURSE)===cid&&x.no===no&&x.i===si)));
    const o=progOf(cid)[no];
    if(o&&o.hard){ const k=o.hard.indexOf(si); if(k>=0){ o.hard.splice(k,1); saveProgress(); } }
    renderHard();
  }
  else if(act==='cardplay'){ (async()=>{ const d=await loadLesson(+el.dataset.no, el.dataset.c);
      const s=d.sentences[+el.dataset.i]; if(s) playSeg(s.t,s.t2,null,audioSrcOf(d.audio)); })(); }
  else if(act==='exp'){
    const blob=new Blob([JSON.stringify({exportedAt:new Date().toISOString(),v:3,progress:PROG,hard:hardAll(),stats:STATS},null,2)],{type:'application/json'});
    const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='nce2_loop备份_'+todayStr()+'.json'; a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href),2000);
  }
  else if(act==='imp'){ $('#impFile').click(); }
  else if(act==='clr'){
    if(!confirm('确定清空全部学习记录？（课程文件不受影响）')) return;
    if(!confirm('再次确认：此操作不可恢复！')) return;
    PROG={_v:3,courses:{}}; STATS={playSec:0,shadowN:0,recN:0,days:{}}; store.setHard([]);
    saveProgress(); saveStats(); renderMe();
  }
});
document.addEventListener('change',e=>{
  if(e.target&&e.target.id==='impFile'&&e.target.files[0]){
    const fr=new FileReader();
    fr.onload=()=>{ try{ const d=JSON.parse(fr.result);
        if(d.progress){ PROG=migrateProg(d.progress); saveProgress(); }   /* 旧格式备份也能导入 */
        if(d.hard){ const a=d.hard.map(x=>Object.assign({cid:DEF_COURSE},x)); store.setHard(a); }
        if(d.stats){ STATS=Object.assign({playSec:0,shadowN:0,recN:0,days:{}},d.stats); saveStats(); }
        alert('已导入'); location.hash='#/home'; router();
      }catch(err){ alert('导入失败：'+err.message); } };
    fr.readAsText(e.target.files[0]);
  }
});

/* ================= 启动 ================= */
/* 真实性校验：标记说「已就绪」不算数，抽 3 个文件确认缓存里真有（防系统清缓存后界面说谎） */
async function verifyDl(id){
  const c=catCourse(id), s=dlGet(id); if(!c||!s||s.state!=='done') return;
  const files=courseFiles(c);
  const picks=[files[0],files[Math.floor(files.length/2)],files[files.length-1]].filter(Boolean);
  try{
    const cache=await caches.open(CACHE_CONTENT);
    for(const f of picks){
      const m=await cache.match(f);
      if(!m){ dlSet(id,Object.assign({},s,{state:'pause',done:0})); return; }
    }
  }catch(e){}
}
async function verifyAll(){ for(const id of myCourses()){ await verifyDl(id); } }
/* 上次没下完（切后台/杀进程）的课程，回来自动续传 */
function resumeDl(){
  setTimeout(()=>{ myCourses().forEach(id=>{
    const s=dlGet(id); if(s&&s.state==='run') dlCourse(id);
  }); }, 1200);
}
hardAll();                                 /* 难句本补 cid（v3 迁移），顺手落盘 */
router();                                  /* 先用内嵌清单渲染，秒开 */
loadCatalog().then(verifyAll).then(()=>{ router(); resumeDl(); }).catch(()=>{});
}
</script>
<script>
/* ===== PWA 安装引导：安卓 beforeinstallprompt 弹横幅（可触发系统安装框）；iOS 弹「分享→添加到主屏幕」分步提示 ===== */
(function(){
  var standalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
  if (standalone) return;                                   // 已安装，不打扰
  var isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent) ||
              (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  var KEY = 'el2_install_hide';
  function canShow(){ try{ var t = +localStorage.getItem(KEY) || 0; return Date.now() > t; }catch(e){ return true; } }
  function hide(days){ try{ localStorage.setItem(KEY, String(Date.now() + days * 864e5)); }catch(e){} }
  function build(title, body, okText, onOk){
    var wrap = document.createElement('div');
    wrap.style.cssText = 'position:fixed;left:12px;right:12px;bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:999;'
      + 'background:#fff;border:1.5px solid #E9ECEF;border-radius:16px;box-shadow:0 10px 30px rgba(33,37,41,.18);padding:14px 16px;';
    wrap.innerHTML = '<div style="display:flex;gap:12px;align-items:flex-start">'
      + '<svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#3B5BDB" stroke-width="2" style="flex:0 0 34px;margin-top:2px">'
      + '<rect x="5" y="2" width="14" height="20" rx="3"/><path d="M9 18h6"/></svg>'
      + '<div style="flex:1"><div style="font-weight:700;font-size:15px;color:#212529">' + title + '</div>'
      + '<div style="font-size:13px;color:#6C757D;line-height:1.55;margin-top:3px">' + body + '</div></div></div>'
      + '<div style="display:flex;gap:10px;margin-top:10px">'
      + '<button id="pwaOk" style="flex:1;min-height:50px;border:0;border-radius:12px;background:#3B5BDB;color:#fff;font-size:15px;font-weight:700;cursor:pointer">' + okText + '</button>'
      + '<button id="pwaNo" style="min-width:88px;min-height:50px;border:1.5px solid #E9ECEF;border-radius:12px;background:#fff;color:#6C757D;font-size:14px;cursor:pointer">暂不</button></div>';
    document.body.appendChild(wrap);
    wrap.querySelector('#pwaOk').addEventListener('click', function(){ hide(365); wrap.remove(); if (onOk) onOk(); });
    wrap.querySelector('#pwaNo').addEventListener('click', function(){ hide(7); wrap.remove(); });
  }
  var deferred = null;
  window.addEventListener('beforeinstallprompt', function(e){
    e.preventDefault(); deferred = e;
    if (canShow()) build('安装 NCE2 Loop 到桌面', '像 App 一样全屏启动，听过一遍的课文离线也能学。', '立即安装', function(){
      if (deferred) { deferred.prompt(); deferred = null; }
    });
  });
  var isAndroid=/android/i.test(navigator.userAgent);
  var hasInstallAPI='onbeforeinstallprompt' in window;
  var isHuawei=/HuaweiBrowser|HarmonyOS|HUAWEI/i.test(navigator.userAgent);
  var androidNoChrome=isAndroid && !/Chrome\/|Edg\/|SamsungBrowser/i.test(navigator.userAgent);
  if ((isHuawei || androidNoChrome) && canShow()) {
    window.addEventListener('load', function(){
      setTimeout(function(){
        if (canShow()) build('添加到桌面（2 步）',
          '安卓浏览器不会自动弹安装框：① 点浏览器右上角「⋮」或底部「我的」打开菜单 ② 选「添加到桌面 / 添加到主屏幕」。完成后从桌面图标全屏进入，听课更流畅。',
          '知道了', null);
      }, 1500);
    });
  }
  if (isIOS && canShow()) {
    window.addEventListener('load', function(){
      setTimeout(function(){
        if (canShow()) build('添加到主屏幕（2 步）',
          'iOS 不会自动弹安装框：① 点浏览器底部的「分享」按钮 ② 在列表里选「添加到主屏幕」。完成后从桌面图标全屏进入。',
          '知道了', null);
      }, 1500);
    });
  }
})();
/* Service Worker 注册（离线学习） */
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); });
}
</script>
